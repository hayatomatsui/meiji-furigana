<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>英検®1級 質問リスニング</title>
    <link rel="stylesheet" href="styles.css?v=13">
    <script src="app.js?v=13" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">EIKEN® Grade 1</p>
          <h1>質問リスニング</h1>
        </div>
        <div class="deck-select" id="deckSelect" role="group" aria-label="練習セット"></div>
        <div class="top-actions" aria-label="session controls">
          <button class="text-btn subtle" id="shuffleBtn" type="button" aria-pressed="false">ランダム</button>
          <button class="text-btn subtle" id="resetBtn" type="button">リセット</button>
        </div>
      </header>

      <main class="workspace">
        <aside class="question-nav" aria-label="question list">
          <div class="nav-summary">
            <div>
              <span class="metric" id="doneCount">0</span>
              <span class="metric-label">done</span>
            </div>
            <div>
              <span class="metric" id="hardCount">0</span>
              <span class="metric-label">focus</span>
            </div>
          </div>
          <div class="question-list" id="questionList"></div>
          <p class="legal-note">
            「英検」は公益財団法人 日本英語検定協会の登録商標です。このコンテンツは、公益財団法人 日本英語検定協会の承認や推奨、その他の検討を受けたものではありません。
          </p>
        </aside>

        <section class="trainer" aria-label="listening trainer">
          <div class="practice-area">
            <div class="practice-meta">
              <span id="questionNumber">01 / 19</span>
              <span id="questionTopic">Journalism</span>
              <span id="segmentStatus">audio loading</span>
            </div>

            <button class="script-card" id="scriptCard" type="button" aria-pressed="false">
              <span class="card-face card-front">
                <span class="script-prompt" id="scriptPrompt" hidden></span>
                <span class="script-text" id="scriptText"></span>
              </span>
              <span class="card-face card-back">
                <span class="masked-title">Listening only</span>
                <span class="masked-number" id="maskedNumber">Question 01</span>
              </span>
            </button>

            <div class="transport" aria-label="audio controls">
              <button class="icon-btn" id="prevBtn" type="button" aria-label="previous question">‹</button>
              <button class="primary-btn" id="playBtn" type="button">再生</button>
              <button class="icon-btn" id="restartBtn" type="button" aria-label="restart question">↺</button>
              <button class="icon-btn" id="nextBtn" type="button" aria-label="next question">›</button>
            </div>

            <div class="timeline-row">
              <span id="currentTime">0:00</span>
              <input id="timeline" class="timeline" type="range" min="0" max="1000" value="0">
              <span id="endTime">0:00</span>
            </div>

            <div class="mode-row">
              <label class="toggle-pill">
                <input id="scriptToggle" type="checkbox" checked>
                <span>スクリプト</span>
              </label>
              <label class="toggle-pill">
                <input id="repeatToggle" type="checkbox">
                <span>リピート</span>
              </label>
              <label class="toggle-pill">
                <input id="autoNextToggle" type="checkbox">
                <span>自動次へ</span>
              </label>
              <label class="select-pill">
                <span>速度</span>
                <select id="rateSelect">
                  <option value="0.8">0.8x</option>
                  <option value="0.9">0.9x</option>
                  <option value="1" selected>1.0x</option>
                  <option value="1.1">1.1x</option>
                  <option value="1.2">1.2x</option>
                </select>
              </label>
            </div>
          </div>

          <aside class="study-tools" aria-label="study tools">
            <div class="tool-block">
              <h2>Practice</h2>
              <button class="wide-btn" id="doneBtn" type="button" aria-pressed="false">聞き取れた</button>
              <button class="wide-btn warning" id="hardBtn" type="button" aria-pressed="false">苦手に追加</button>
            </div>

            <div class="tool-block">
              <h2>Range</h2>
              <div class="range-grid">
                <button class="small-btn" id="startBackBtn" type="button">開始 -0.3</button>
                <button class="small-btn" id="startForwardBtn" type="button">開始 +0.3</button>
                <button class="small-btn" id="endBackBtn" type="button">終了 -0.3</button>
                <button class="small-btn" id="endForwardBtn" type="button">終了 +0.3</button>
              </div>
              <button class="wide-btn subtle" id="rangeResetBtn" type="button">範囲を戻す</button>
              <button class="wide-btn subtle" id="rangeExportBtn" type="button">調整を書き出す</button>
            </div>

            <div class="tool-block compact">
              <h2>Time</h2>
              <p class="time-readout" id="rangeReadout">0:00 - 0:00</p>
            </div>
          </aside>
        </section>
      </main>
    </div>

    <audio id="questionAudio" preload="auto" src="assets/questions.mp3"></audio>
  </body>
</html>
