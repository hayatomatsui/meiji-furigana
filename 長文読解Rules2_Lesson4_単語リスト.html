document.getElementById("sumbody").innerHTML=ORDER.map(l=>{
 const n=cnt[l],p=Math.round(n/DATA.length*100);
 return `<tr><td><span class="badge" style="background:${LV[l].c}">${l}</span></td>
 <td><b>${n}</b></td><td style="color:var(--tw);font-weight:700">${cntW[l]}</td>
 <td style="color:var(--ti);font-weight:700">${cntI[l]}</td>
 <td><span class="bar" style="width:${Math.max(p*2.6,6)}px;background:${LV[l].c}"></span>${p}%</td>
 <td style="color:var(--sub)">${LV[l].note}</td></tr>`;}).join("");

document.getElementById("filters").innerHTML=
 `<button class="on" data-lv="all">すべて</button>`+
 ORDER.map(l=>cnt[l]?`<button data-lv="${l}" style="color:${LV[l].c}">${l} (${cnt[l]})</button>`:"").join("");
document.getElementById("filters").onclick=e=>{
 if(e.target.tagName!=="BUTTON")return;
 [...e.currentTarget.children].forEach(b=>b.classList.remove("on"));
 e.target.classList.add("on");activeLv=e.target.dataset.lv;render();};

function list(){return data.filter(d=>
 (activeLv==="all"||d[3]===activeLv)&&
 (activeType==="all"||d[5]===activeType)&&
 !(hideDone&&done.has(d[0])));}

function render(){
 const L=list();
 document.getElementById("grid").innerHTML=L.map(d=>{
  const[p,m,ex,lv,ln,ty]=d, t=ty==="単語"?"w":"i";
  return `<div class="card hidden" data-w="${p}" style="border-left-color:${LV[lv].c}">
   <span class="check">✓ 覚えた</span>
   <div class="top"><span class="phrase">${p}</span>
   <span style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">
   <span class="badge" style="background:${LV[lv].c}">${lv}</span>
   <span class="tag ${t}">${ty}</span></span></div>
   <div class="line">${ln?"l."+ln:"設問"}</div>
   <div class="meaning">${m}</div>
   <div class="ex">${ex}</div>
   <div class="hint">タップで表示 ／ ダブルクリックで「覚えた」</div></div>`;}).join("");
 [...document.getElementById("grid").children].forEach(c=>{
  if(done.has(c.dataset.w))c.classList.add("done");
  c.onclick=()=>c.classList.toggle("hidden");
  c.ondblclick=e=>{e.preventDefault();const w=c.dataset.w;
   done.has(w)?done.delete(w):done.add(w);render();};});

 document.getElementById("tbody").innerHTML=L.map(d=>{
  const[p,m,ex,lv,ln,ty]=d, t=ty==="単語"?"w":"i";
  return `<tr class="hid ${done.has(p)?'done':''}" data-w="${p}">
   <td><span class="mark">✓</span></td>
   <td><span class="tag ${t}">${ty}</span></td>
   <td class="ph">${p}</td><td class="mn">${m}</td>
   <td class="exc">${ex}</td>
   <td><span class="badge" style="background:${LV[lv].c}">${lv}</span></td>
   <td class="ln">${ln?"l."+ln:"設問"}</td></tr>`;}).join("");
 [...document.getElementById("tbody").children].forEach(tr=>{
  tr.querySelector(".mn").onclick=()=>tr.classList.toggle("hid");
  tr.querySelector(".exc").onclick=()=>tr.classList.toggle("hid");
  tr.querySelector(".mark").onclick=()=>{const w=tr.dataset.w;
   done.has(w)?done.delete(w):done.add(w);render();};});

 document.getElementById("shown").textContent=L.length;
 document.getElementById("doneN").textContent=done.size;
}

function setView(v){
 document.getElementById("cardView").classList.toggle("hide",v!=="card");
 document.getElementById("tableView").classList.toggle("hide",v!=="table");
 document.getElementById("bCard").classList.toggle("on",v==="card");
 document.getElementById("bTable").classList.toggle("on",v==="table");}
function setType(t){activeType=t;
 document.getElementById("tAll").classList.toggle("on",t==="all");
 document.getElementById("tW").classList.toggle("on",t==="単語");
 document.getElementById("tI").classList.toggle("on",t==="熟語");render();}
function allHide(){document.querySelectorAll(".card").forEach(c=>c.classList.add("hidden"));
 document.querySelectorAll("#tbody tr").forEach(t=>t.classList.add("hid"));}
function allShow(){document.querySelectorAll(".card").forEach(c=>c.classList.remove("hidden"));
 document.querySelectorAll("#tbody tr").forEach(t=>t.classList.remove("hid"));}
function shuffle(){for(let i=data.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[data[i],data[j]]=[data[j],data[i]];}render();}
function resetOrder(){data=[...DATA];render();}
function resetDone(){done.clear();render();}
function toggleDoneFilter(){hideDone=!hideDone;
 document.getElementById("hideDoneBtn").textContent=hideDone?"覚えた項目も表示":"覚えた項目を隠す";render();}

render();
</script>
</body>
</html>
