<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>瞬間英作文トレーナー — 基本文例132</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#16181d; --sub:#6b7280; --line:#e5e7eb;
  --accent:#2f6df6; --accent-soft:#eaf1ff;
  --ok:#16a34a; --ok-soft:#e7f7ec; --mid:#d97706; --mid-soft:#fdf3e2; --ng:#dc2626; --ng-soft:#fdeaea;
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,"Segoe UI",sans-serif;
  line-height:1.7; padding:0 0 60px;
}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}

/* Header */
header{padding:22px 0 14px}
h1{font-size:19px;margin:0;letter-spacing:.02em}
h1 span{color:var(--sub);font-weight:400;font-size:13px;margin-left:8px}

/* Progress bar */
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;display:flex;margin-top:12px}
.bar i{display:block;height:100%}
.bar .b-ok{background:var(--ok)} .bar .b-mid{background:var(--mid)} .bar .b-ng{background:var(--ng)}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--sub);margin-top:8px}
.stats b{color:var(--ink);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:5px;vertical-align:1px}

/* Controls */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-top:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row + .row{margin-top:10px}
label.lb{font-size:12px;color:var(--sub);min-width:64px}
select,input[type=number]{
  font:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);
}
select{max-width:100%}
input[type=number]{width:74px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.seg button{
  font:inherit;font-size:13px;padding:7px 12px;border:0;background:#fff;color:var(--sub);cursor:pointer;
}
.seg button + button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:#fff}
.mini{font-size:12px;color:var(--sub);background:none;border:0;cursor:pointer;text-decoration:underline;padding:4px}

/* Card */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:24px 22px;margin-top:16px;box-shadow:0 1px 2px rgba(16,24,40,.04);
}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--sub);margin-bottom:14px}
.no{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent);letter-spacing:.06em}
.tag{background:var(--accent-soft);color:var(--accent);padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:600;text-align:right}
.jp{font-size:22px;font-weight:600;line-height:1.75;letter-spacing:.01em}
@media(max-width:520px){.jp{font-size:19px}}

.answer{margin-top:18px;padding-top:18px;border-top:1px dashed var(--line)}
.answer.hidden{display:none}
.en{font-size:21px;font-weight:600;line-height:1.6;font-family:"Helvetica Neue",Arial,sans-serif}
@media(max-width:520px){.en{font-size:18px}}
.point{margin-top:10px;font-size:12.5px;color:var(--sub)}
.point b{color:var(--ink);font-weight:600}

.typebox{margin-top:16px}
.typebox textarea{
  width:100%;font:inherit;font-size:16px;font-family:"Helvetica Neue",Arial,sans-serif;
  padding:11px 12px;border:1px solid var(--line);border-radius:11px;resize:vertical;min-height:64px;background:#fff;color:var(--ink);
}
.typebox textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.diff{margin-top:10px;font-size:15px;font-family:"Helvetica Neue",Arial,sans-serif;line-height:1.9}
.diff .g{background:var(--ok-soft);color:#12692f;border-radius:4px;padding:1px 3px}
.diff .b{background:var(--ng-soft);color:#a51b1b;border-radius:4px;padding:1px 3px;text-decoration:line-through}
.diff .m{background:#eef0f3;color:var(--sub);border-radius:4px;padding:1px 3px}
.score{font-size:12.5px;color:var(--sub);margin-top:6px}

/* Buttons */
.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{
  font:inherit;font-size:15px;font-weight:600;padding:12px 18px;border-radius:11px;border:1px solid var(--line);
  background:#fff;color:var(--ink);cursor:pointer;flex:1;min-width:110px;transition:.12s;
}
.btn:hover{border-color:#c8ccd4}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#255ad4}
.btn.ghost{flex:0 0 auto;min-width:0;padding:12px 14px}
.grade{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.grade button{
  font:inherit;font-size:14px;font-weight:600;padding:12px 10px;border-radius:11px;border:1px solid var(--line);
  cursor:pointer;flex:1;min-width:96px;background:#fff;transition:.12s;
}
.grade .g-ok{color:var(--ok)} .grade .g-ok:hover{background:var(--ok-soft);border-color:var(--ok)}
.grade .g-mid{color:var(--mid)} .grade .g-mid:hover{background:var(--mid-soft);border-color:var(--mid)}
.grade .g-ng{color:var(--ng)} .grade .g-ng:hover{background:var(--ng-soft);border-color:var(--ng)}
.grade small{display:block;font-weight:400;font-size:11px;color:var(--sub);margin-top:1px}

.hint{font-size:11.5px;color:var(--sub);margin-top:14px;text-align:center}
kbd{background:#eef0f3;border-radius:4px;padding:1px 5px;font-family:inherit;font-size:11px}
.empty{text-align:center;padding:40px 10px;color:var(--sub)}
.status{font-size:12px;color:var(--sub);margin-top:6px}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;margin-left:6px}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.mid{background:var(--mid-soft);color:var(--mid)}
.badge.ng{background:var(--ng-soft);color:var(--ng)}
footer{text-align:center;font-size:11.5px;color:var(--sub);margin-top:26px}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>瞬間英作文トレーナー<span>基本文例 132</span></h1>
  <div class="bar" id="bar"></div>
  <div class="stats" id="stats"></div>
</header>

<div class="panel">
  <div class="row">
    <label class="lb">範囲</label>
    <select id="chapter"></select>
    <input type="number" id="from" min="1" max="132" value="1">
    <span style="color:var(--sub);font-size:13px">〜</span>
    <input type="number" id="to" min="1" max="132" value="132">
  </div>
  <div class="row">
    <label class="lb">出題</label>
    <div class="seg" id="segOrder">
      <button data-v="seq" class="on">順番</button>
      <button data-v="shuffle">シャッフル</button>
    </div>
    <div class="seg" id="segFilter">
      <button data-v="all" class="on">すべて</button>
      <button data-v="weak">苦手のみ</button>
      <button data-v="unlearned">未習得</button>
    </div>
  </div>
  <div class="row">
    <label class="lb">入力</label>
    <div class="seg" id="segType">
      <button data-v="off" class="on">口頭のみ</button>
      <button data-v="on">タイピング採点</button>
    </div>
    <button class="mini" id="reset">進捗をリセット</button>
  </div>
  <div class="status" id="deckInfo"></div>
</div>

<div id="stage"></div>

<footer>進捗はこのブラウザに自動保存されます</footer>
</div>

<script>

};

/* ---------- helpers ---------- */
function grade(n){ return mem[n] || null; }               // "ok" | "mid" | "ng"
function setGrade(n,g){ mem[n]=g; store.save(); }

function buildDeck(){
  let list = DATA.filter(d=>d.n>=S.from && d.n<=S.to);
  if(S.chapter) list = list.filter(d=>d.c===S.chapter);
  if(S.filter==="weak")      list = list.filter(d=>{const g=grade(d.n); return g==="ng"||g==="mid";});
  if(S.filter==="unlearned") list = list.filter(d=>grade(d.n)!=="ok");
  if(S.order==="shuffle"){
    for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]];}
  }
  S.deck = list; S.i = 0; S.shown = false;
}

function renderStats(){
  let ok=0,mid=0,ng=0;
  DATA.forEach(d=>{const g=grade(d.n); if(g==="ok")ok++; else if(g==="mid")mid++; else if(g==="ng")ng++;});
  const t = DATA.length;
  barEl.innerHTML =
    `<i class="b-ok" style="width:${ok/t*100}%"></i>`+
    `<i class="b-mid" style="width:${mid/t*100}%"></i>`+
    `<i class="b-ng" style="width:${ng/t*100}%"></i>`;
  statsEl.innerHTML =
    `<span><span class="dot" style="background:var(--ok)"></span>覚えた <b>${ok}</b></span>`+

    `<span style="margin-left:auto">習得率 <b>${Math.round(ok/t*100)}%</b></span>`;
}

/* word-level diff */
const norm = s => s.toLowerCase().replace(/[.,!?;:"'’“”()]/g,"").replace(/\s+/g," ").trim();
function tok(s){ return norm(s).split(" ").filter(Boolean); }
function lcs(a,b){
  const m=a.length,n=b.length, dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)
    dp[i][j] = a[i]===b[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j],dp[i][j+1]);
  const out=[]; let i=0,j=0;
  while(i<m&&j<n){
    if(a[i]===b[j]){out.push(["=",a[i]]);i++;j++;}
    else if(dp[i+1][j]>=dp[i][j+1]){out.push(["-",a[i]]);i++;}
    else {out.push(["+",b[j]]);j++;}
  }
  while(i<m)out.push(["-",a[i++]]);
  while(j<n)out.push(["+",b[j++]]);
  return out;
}
function renderDiff(userText, answer){
  const u=tok(userText), a=tok(answer);
  if(!u.length) return null;
  const d=lcs(u,a);
  let hit=0;
  const html = d.map(([op,w])=>{
    if(op==="="){hit++; return `<span class="g">${esc(w)}</span>`;}
    if(op==="-") return `<span class="b">${esc(w)}</span>`;
    return `<span class="m">${esc(w)}</span>`;
  }).join(" ");
  const pct = a.length ? Math.round(hit/a.length*100) : 0;
  return {html, pct, perfect: norm(userText)===norm(answer)};
}
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

/* TTS */
function speak(text){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text.replace(/[()]/g,""));
  u.lang="en-US"; u.rate=0.92;
  speechSynthesis.speak(u);
}

  };

  if($("show")) $("show").onclick = showAns;
  if($("skip")) $("skip").onclick = ()=>{ S.i++; S.shown=false; lastInput=""; render(); };
  if($("next")) $("next").onclick = ()=>{ S.i++; S.shown=false; lastInput=""; render(); };
  if($("speak")) $("speak").onclick = ()=> speak(d.e);
  stage.querySelectorAll(".grade button").forEach(b=>{
    b.onclick = ()=>{ setGrade(d.n, b.dataset.g); S.i++; S.shown=false; lastInput=""; render(); };
  });
  const ta = $("input");
  if(ta){
    if(!S.shown){ ta.value = lastInput; ta.focus(); }
    ta.addEventListener("keydown", e=>{
      if((e.metaKey||e.ctrlKey) && e.key==="Enter"){ e.preventDefault(); showAns(); }
    });
  }
}
let lastInput = "";

/* ---------- controls ---------- */
function setSeg(id,val){
  document.querySelectorAll(`#${id} button`).forEach(b=>b.classList.toggle("on", b.dataset.v===val));
}
function wireSeg(id, fn){
  document.querySelectorAll(`#${id} button`).forEach(b=>{
    b.onclick = ()=>{ setSeg(id,b.dataset.v); fn(b.dataset.v); buildDeck(); lastInput=""; render(); };
  });
}
wireSeg("segOrder",  v=> S.order=v);
wireSeg("segFilter", v=> S.filter=v);
wireSeg("segType",   v=> S.typing=(v==="on"));

chSel.onchange = ()=>{
  S.chapter = chSel.value;
  if(S.chapter){
    const ns = DATA.filter(d=>d.c===S.chapter).map(d=>d.n);
    S.from = ns[0]; S.to = ns[ns.length-1];
    $("from").value = S.from; $("to").value = S.to;
  } else { S.from=1; S.to=132; $("from").value=1; $("to").value=132; }
  buildDeck(); lastInput=""; render();
};
$("from").oninput = ()=>{ S.from = Math.max(1, Math.min(132, +$("from").value||1)); buildDeck(); render(); };
$("to").oninput   = ()=>{ S.to   = Math.max(1, Math.min(132, +$("to").value||132)); buildDeck(); render(); };

$("reset").onclick = ()=>{
  if(confirm("すべての進捗を消去します。よろしいですか？")){
    mem = {}; store.save(); buildDeck(); render();
  }
};

/* keyboard */
document.addEventListener("keydown", e=>{
  if(e.target.tagName==="TEXTAREA"||e.target.tagName==="INPUT"||e.target.tagName==="SELECT") return;
  if(!S.deck.length || S.i>=S.deck.length) return;
  if(!S.shown && (e.code==="Space"||e.key==="Enter")){ e.preventDefault(); const b=$("show"); if(b)b.click(); return; }
  if(S.shown){
    if(e.key==="1"){ stage.querySelector('[data-g="ok"]').click(); }
    else if(e.key==="2"){ stage.querySelector('[data-g="mid"]').click(); }
    else if(e.key==="3"){ stage.querySelector('[data-g="ng"]').click(); }
    else if(e.key==="ArrowRight"){ const b=$("next"); if(b)b.click(); }
    else if(e.key.toLowerCase()==="s"){ const b=$("speak"); if(b)b.click(); }
  }
});

buildDeck();
render();
</script>
</body>
</html>
